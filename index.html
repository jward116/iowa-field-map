<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Iowa Tribe Intel - Tactical Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #000000; /* Pure black for MDT screens */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }
        #map { 
            height: 100vh; 
            width: 100vw; 
            z-index: 1; 
        }
        /* Tactical UI Overlay */
        #ui-layer { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            pointer-events: none;
        }
        .header-panel {
            pointer-events: auto; 
            background: rgba(15, 15, 15, 0.95); 
            color: #ffffff; 
            padding: 10px 15px; 
            border-bottom: 2px solid #333333; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .system-title {
            color: #00ff00; /* High-vis tactical green */
            font-weight: 900;
            letter-spacing: 1px;
            font-size: 14px;
        }
        .status-indicator {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 3px;
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="header-panel">
            <div class="system-title">IOWA TRIBE INTEL // SECURE TERMINAL</div>
            <div id="gps-status" class="status-indicator">GPS: OFFLINE</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>

    <script>
        // Initialize Map focused on White Cloud region
        const map = L.map('map', {
            zoomControl: false, // We will build a custom, larger zoom control later for touchscreens
            attributionControl: false // Cleans up the UI
        }).setView([39.9772, -95.2974], 12);

        // Load CartoDB Dark Matter Base (Tactical Night Mode)
        const darkBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            subdomains: 'abcd'
        }).addTo(map);

        // --- Future Data Hooks go here ---
        // We will wire the Esri parcel layer and the GeoJSON boundary next.

    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Iowa Tribe Field Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #121212; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #header { 
            position: absolute; top: 0; width: 100%; z-index: 1000;
            background: rgba(26, 26, 26, 0.9); color: white; padding: 15px;
            border-bottom: 2px solid #333; display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>
    <div id="header">
        <div style="font-weight: bold; color: #4ade80;">IOWA TRIBE INTEL</div>
        <div id="status" style="font-size: 12px; color: #ff4444;">SEARCHING GPS...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([39.85, -95.15], 12);

        // 2. Add Satellite Imagery
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}').addTo(map);

        // 3. Load Iowa Tribe Boundary
        fetch("https://services.arcgis.com/P3ePLMYs2RVChqkv/arcgis/rest/services/USA_Tribal_Lands/FeatureServer/0/query?where=BASENAME%20%3D%20'Iowa%20(KS-NE)'&outFields=*&f=geojson")
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, { style: { color: '#4ade80', weight: 3, fillOpacity: 0.1 } }).addTo(map);
            });

        // 4. Real-Time GPS
        const statusEl = document.getElementById('status');
        const userMarker = L.circle([0,0], { radius: 10, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);

        navigator.geolocation.watchPosition((p) => {
            const lat = p.coords.latitude;
            const lng = p.coords.longitude;
            userMarker.setLatLng([lat, lng]);
            map.setView([lat, lng], 15);
            statusEl.innerHTML = "GPS LOCKED";
            statusEl.style.color = "#4ade80";
        }, (e) => {
            statusEl.innerHTML = "GPS ERROR";
        }, { enableHighAccuracy: true });
    </script>
</body>
</html>
